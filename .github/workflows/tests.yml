name: tests

on:
  push:
    branches: [main, impl/80-test-matrix]  # TEMP: drop before merge
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 3.11 is the minimum the README names; 3.x is the newest stable release.
        python: ["3.11", "3.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # pdftotext (poppler) is optional for Mimir; its tests skip where it is missing (Windows).
      - name: Install pdftotext (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Install pdftotext (macOS)
        if: runner.os == 'macOS'
        run: brew install poppler
      - name: TEMP which pdftotext
        if: runner.os == 'Windows'
        run: python -c "import shutil, subprocess; exe = shutil.which('pdftotext'); print(exe); print(subprocess.run([exe, '-v'], capture_output=True))"
      - run: python -m pip install pytest
      - run: python -m pytest tests -q -rs
