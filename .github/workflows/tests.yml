name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      # tests/check.py pins the ruff version: ruff.toml takes preview rules, and preview rules change between releases.
      - run: python3 tests/check.py lint

  scripts:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 3.11 is the minimum the README names; 3.x is the newest stable release.
        python: ["3.11", "3.x"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # pdftotext (poppler) is optional for Mimir; its tests skip where it is missing (Windows).
      - name: Install pdftotext (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Install pdftotext (macOS)
        if: runner.os == 'macOS'
        run: brew install poppler
      - run: python -m pip install pytest pytest-xdist
      - run: python -m pytest tests -q -rs -n auto
