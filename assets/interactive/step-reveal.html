<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="{{CSP}}">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>{{TITLE}}</title>
<style>{{KATEX_CSS}}</style>
<style>
:root {
  color-scheme: light dark;
  --bg: #ffffff;
  --fg: #1b1b1b;
  --muted: #4d4d4d;
  --link: #0b57d0;
  --rule: #767676;
  --error: #b3261e;
  --button-bg: #0b57d0;
  --button-fg: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121212;
    --fg: #ececec;
    --muted: #c7c7c7;
    --link: #a8c7fa;
    --rule: #8f8f8f;
    --error: #ffb4ab;
    --button-bg: #a8c7fa;
    --button-fg: #0b1d3a;
  }
}
*, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--fg); font: 1.0625rem/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 46rem; margin: 0 auto; padding: 2rem 1rem 4rem; }
h1 { font-size: 1.6rem; line-height: 1.3; margin: 0 0 1.5rem; }
h2 { font-size: 1.25rem; line-height: 1.3; margin: 2rem 0 0.75rem; padding-bottom: 0.25rem; border-bottom: 1px solid var(--rule); }
p { margin: 0.75rem 0; }
.mimir-display { margin: 1rem 0; overflow-x: auto; overflow-y: hidden; }
.original { margin: 1rem 0; }
.original img { display: block; max-width: 100%; height: auto; border: 1px solid var(--rule); }
.original figcaption, .original-link { color: var(--muted); font-size: 0.95rem; }
a { color: var(--link); text-decoration: underline; }
a:focus-visible, button:focus-visible { outline: 3px solid var(--link); outline-offset: 2px; }
.katex-error { color: var(--error) !important; text-decoration: underline wavy; }
.steps { list-style: none; margin: 0; padding: 0; }
.step { border-left: 4px solid var(--rule); padding-left: 1rem; }
.step h2 { border-bottom: none; }
.controls { position: sticky; bottom: 0; background: var(--bg); padding: 1rem 0; border-top: 1px solid var(--rule); margin-top: 2rem; }
button { font: inherit; padding: 0.5rem 1rem; margin-right: 0.5rem; border: 2px solid var(--button-bg); border-radius: 0.25rem; cursor: pointer; }
#mimir-next { background: var(--button-bg); color: var(--button-fg); }
#mimir-back { background: var(--bg); color: var(--fg); }
.hint { color: var(--muted); font-size: 0.95rem; }
</style>
</head>
<body>
<main>
<h1>{{TITLE}}</h1>
{{BLOCKS}}
<ol class="steps">
{{STEPS}}
</ol>
<div class="controls" id="mimir-controls" hidden>
<button type="button" id="mimir-next">Show next step</button><button type="button" id="mimir-back">Hide last step</button>
<p class="hint">Enter or Space on a button; the right and down arrows show the next step, the left and up arrows hide the last one.</p>
<p id="mimir-status" role="status" aria-live="polite"></p>
</div>
</main>
<script>{{KATEX_JS}}</script>
<script>{{AUTO_RENDER_JS}}</script>
<script>
(function () {
  "use strict";
  var base = {output: "htmlAndMathml", throwOnError: false, trust: false};
  var blocks = document.querySelectorAll(".mimir-display");
  for (var i = 0; i < blocks.length; i++) {
    var source = blocks[i].textContent;
    try {
      katex.render(source, blocks[i], {output: base.output, throwOnError: base.throwOnError,
                                       trust: base.trust, displayMode: true});
    } catch (error) {
      blocks[i].textContent = source;
    }
  }
  renderMathInElement(document.querySelector("main"), {
    output: base.output, throwOnError: base.throwOnError, trust: base.trust,
    delimiters: [{left: "\\(", right: "\\)", display: false},
                 {left: "\\[", right: "\\]", display: true}],
    ignoredClasses: ["mimir-display"]
  });
})();
</script>
<script>
(function () {
  "use strict";
  var steps = document.querySelectorAll(".step");
  var next = document.getElementById("mimir-next");
  var back = document.getElementById("mimir-back");
  var status = document.getElementById("mimir-status");
  var shown = 0;
  function update() {
    for (var i = 0; i < steps.length; i++) {
      steps[i].hidden = i >= shown;
    }
  }
  function say(text) {
    status.textContent = text;
  }
  function forward() {
    if (shown >= steps.length) {
      say("All " + steps.length + " steps are shown.");
      return;
    }
    shown += 1;
    update();
    steps[shown - 1].scrollIntoView({block: "nearest"});
    say("Step " + shown + " of " + steps.length + (shown === steps.length ? ", the last step." : "."));
  }
  function backward() {
    if (shown === 0) {
      say("No steps are shown.");
      return;
    }
    shown -= 1;
    update();
    say(shown === 0 ? "No steps are shown." : "Step " + shown + " of " + steps.length + " is the last one shown.");
  }
  next.addEventListener("click", forward);
  back.addEventListener("click", backward);
  document.addEventListener("keydown", function (event) {
    var target = event.target;
    if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey ||
        (target && target.classList && target.classList.contains("mimir-display"))) {
      return;
    }
    if (event.key === "ArrowRight" || event.key === "ArrowDown") {
      event.preventDefault();
      forward();
    } else if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
      event.preventDefault();
      backward();
    }
  });
  update();
  document.getElementById("mimir-controls").hidden = false;
  say(steps.length + (steps.length === 1 ? " step" : " steps") + " to reveal.");
})();
</script>
</body>
</html>
