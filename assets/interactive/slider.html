<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="{{CSP}}">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>{{TITLE}}</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #ffffff;
  --fg: #1b1b1b;
  --muted: #4d4d4d;
  --link: #0b57d0;
  --rule: #767676;
  --mark: #e8eef9;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121212;
    --fg: #ececec;
    --muted: #c7c7c7;
    --link: #a8c7fa;
    --rule: #8f8f8f;
    --mark: #23324a;
  }
}
*, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--fg); font: 1.0625rem/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 46rem; margin: 0 auto; padding: 2rem 1rem 4rem; }
h1 { font-size: 1.6rem; line-height: 1.3; margin: 0 0 1.5rem; }
h2 { font-size: 1.25rem; line-height: 1.3; margin: 2rem 0 0.75rem; padding-bottom: 0.25rem; border-bottom: 1px solid var(--rule); }
p { margin: 0.75rem 0; }
label { display: block; font-weight: 600; }
input[type="range"] { width: 100%; margin: 0.5rem 0; accent-color: var(--link); }
input[type="range"]:focus-visible { outline: 3px solid var(--link); outline-offset: 4px; }
output { display: block; font-size: 1.2rem; font-weight: 600; margin: 0.5rem 0; }
.muted { color: var(--muted); }
table { border-collapse: collapse; width: 100%; margin: 0.75rem 0; }
th, td { border: 1px solid var(--rule); padding: 0.25rem 0.6rem; text-align: left; }
tr[aria-current="true"] td { background: var(--mark); font-weight: 700; }
tr[aria-current="true"] td:first-child::before { content: "▶ "; }
</style>
</head>
<body>
<main>
<h1>{{TITLE}}</h1>
<section id="mimir-controls" hidden>
<label for="mimir-start-day">Start day</label>
<input type="range" id="mimir-start-day" min="0" max="{{MAX}}" step="1" value="0" aria-valuetext="{{FIRST}}">
<output id="mimir-row" for="mimir-start-day" aria-live="polite">{{FIRST}}</output>
<p class="muted">Arrow keys move one day; Home and End jump to today and the exam eve.</p>
</section>
<p>{{CONFIDENCE}}</p>
<h2>Every start day</h2>
<table>
<thead><tr><th scope="col">Start</th><th scope="col">Days to the exam</th><th scope="col">Study a day</th></tr></thead>
<tbody>
{{ROWS}}
</tbody>
</table>
</main>
<script type="application/json" id="mimir-rows">{{DATA}}</script>
<script>
(function () {
  "use strict";
  var texts = JSON.parse(document.getElementById("mimir-rows").textContent);
  var slider = document.getElementById("mimir-start-day");
  var output = document.getElementById("mimir-row");
  var rows = document.querySelectorAll("tbody tr");
  function update() {
    var index = Number(slider.value);
    output.textContent = texts[index];
    slider.setAttribute("aria-valuetext", texts[index]);
    for (var i = 0; i < rows.length; i++) {
      if (i === index) {
        rows[i].setAttribute("aria-current", "true");
      } else {
        rows[i].removeAttribute("aria-current");
      }
    }
  }
  slider.addEventListener("input", update);
  document.getElementById("mimir-controls").hidden = false;
  update();
})();
</script>
</body>
</html>
