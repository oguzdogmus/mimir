<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 0 100 137" class="mm-svg" focusable="false" aria-hidden="true">
<style>
.mimir-mascot {
  --mm-skin: #f9dcc6;
  --mm-skin-deep: #efbd9f;
  --mm-nose: #e79c85;
  --mm-blush: #e4837f;
  --mm-beard: #ece7df;
  --mm-brow: #92826f;
  --mm-line: #463229;
  --mm-gold: #ffd24a;
  --mm-eye: #fff8e8;
  --mm-edge: #fbf8f1;
}
.mimir-mascot .mm-svg { display: block; width: 100%; height: auto; overflow: visible; }
.mimir-mascot .mm-edge-p { fill: var(--mm-edge); stroke: var(--mm-edge); stroke-width: 7; stroke-linejoin: round; stroke-linecap: round; }
.mimir-mascot .mm-edge-t { fill: var(--mm-edge); stroke: var(--mm-edge); stroke-width: 3.4; stroke-linejoin: round; stroke-linecap: round; }
.mimir-mascot .mm-ln { stroke: var(--mm-line); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.mimir-mascot .mm-w2 { stroke-width: 2; }
.mimir-mascot .mm-w18 { stroke-width: 1.8; }
.mimir-mascot .mm-w16 { stroke-width: 1.6; }
.mimir-mascot .mm-w34 { stroke-width: 3.4; }
.mimir-mascot .mm-nofill { fill: none; }
.mimir-mascot .mm-skin { fill: var(--mm-skin); }
.mimir-mascot .mm-deep { fill: var(--mm-skin-deep); }
.mimir-mascot .mm-nose { fill: var(--mm-nose); }
.mimir-mascot .mm-beard { fill: var(--mm-beard); }
.mimir-mascot .mm-gold { fill: var(--mm-gold); }
.mimir-mascot .mm-eye { fill: var(--mm-eye); }
.mimir-mascot .mm-ink { fill: var(--mm-line); }
.mimir-mascot .mm-hole { fill: var(--mm-line); opacity: .5; }
.mimir-mascot .mm-blush { fill: var(--mm-blush); }
.mimir-mascot .mm-brow-l { fill: var(--mm-brow); stroke: var(--mm-line); stroke-width: 1.9; stroke-linejoin: round; stroke-linecap: round; }
.mimir-mascot .mm-mk { fill: var(--mm-accent); stroke: var(--mm-line); stroke-width: 1.3; stroke-linejoin: round; stroke-linecap: round; }
/* moods: the active mood's face parts and mark are shown; no data-mood counts as curious */
.mimir-mascot[data-mood]:not([data-mood="curious"]) .mm-curious,
.mimir-mascot:not([data-mood="explaining"]) .mm-explaining,
.mimir-mascot:not([data-mood="thinking"]) .mm-thinking,
.mimir-mascot:not([data-mood="surprised"]) .mm-surprised,
.mimir-mascot:not([data-mood="pleased"]) .mm-pleased,
.mimir-mascot:not([data-mood="proud"]) .mm-proud { opacity: 0; }
@media (prefers-reduced-motion: no-preference) {
  [data-motion="gentle"] .mimir-mascot .mm-face,
  [data-motion="gentle"] .mimir-mascot .mm-mark,
  [data-motion="full"] .mimir-mascot .mm-face,
  [data-motion="full"] .mimir-mascot .mm-mark { transition: opacity 200ms ease; }
  [data-motion="full"] .mimir-mascot .mm-bob { animation: mm-bob 3.4s ease-in-out infinite; }
  [data-motion="full"] .mimir-mascot .mm-blink { transform-box: fill-box; transform-origin: center; animation: mm-blink 5.5s infinite; }
  @keyframes mm-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2.2px); } }
  @keyframes mm-blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.12); } }
}
</style>

