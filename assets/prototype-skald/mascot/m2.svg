<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -6 120 158" class="mm-root" aria-hidden="true">
<style>
.mimir-mascot .mm-ln{fill:none;stroke:var(--mm-ink);stroke-width:4.6;stroke-linecap:round;stroke-linejoin:round}
.mimir-mascot .mm-ln.mm-sf{stroke:var(--mm-soft)}
.mimir-mascot .mm-dot{fill:var(--mm-ink)}
.mimir-mascot .mm-fill{fill:var(--mm-ink);stroke:var(--mm-ink);stroke-width:4.6;stroke-linejoin:round}
.mimir-mascot .mm-skin{fill:var(--mm-paper)}
.mimir-mascot .mm-wash{fill:color-mix(in srgb,var(--mm-soft) 26%,var(--mm-paper))}
.mimir-mascot .mm-blush{fill:color-mix(in srgb,var(--mm-accent) 55%,color-mix(in srgb,var(--mm-ink) 10%,var(--mm-paper)))}
.mimir-mascot .mm-mk{fill:none;stroke:var(--mm-accent);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.mimir-mascot .mm-mkdot{fill:var(--mm-accent)}
.mimir-mascot:not([data-mood="curious"]) .mm-curious,
.mimir-mascot:not([data-mood="explaining"]) .mm-explaining,
.mimir-mascot:not([data-mood="thinking"]) .mm-thinking,
.mimir-mascot:not([data-mood="surprised"]) .mm-surprised,
.mimir-mascot:not([data-mood="pleased"]) .mm-pleased,
.mimir-mascot:not([data-mood="proud"]) .mm-proud{opacity:0}
.mimir-mascot:not([data-mood]) .mm-curious{opacity:1}
@media (prefers-reduced-motion:no-preference){
[data-motion="gentle"] .mimir-mascot .mm-face,
[data-motion="gentle"] .mimir-mascot .mm-mark,
[data-motion="full"] .mimir-mascot .mm-face,
[data-motion="full"] .mimir-mascot .mm-mark{transition:opacity .2s ease}
[data-motion="full"] .mimir-mascot .mm-bob{animation:mm-m2-bob 2.6s ease-in-out infinite}
[data-motion="full"] .mimir-mascot .mm-blink{transform-box:fill-box;transform-origin:center;animation:mm-m2-blink 5s infinite}
[data-motion="full"] .mimir-mascot[data-mood="curious"] .mm-face.mm-curious,
[data-motion="full"] .mimir-mascot[data-mood="explaining"] .mm-face.mm-explaining,
[data-motion="full"] .mimir-mascot[data-mood="thinking"] .mm-face.mm-thinking,
[data-motion="full"] .mimir-mascot[data-mood="surprised"] .mm-face.mm-surprised,
[data-motion="full"] .mimir-mascot[data-mood="pleased"] .mm-face.mm-pleased,
[data-motion="full"] .mimir-mascot[data-mood="proud"] .mm-face.mm-proud{animation:mm-m2-nod .45s ease-out}
}
@keyframes mm-m2-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@keyframes mm-m2-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.15)}}
@keyframes mm-m2-nod{0%{transform:translateY(0)}40%{transform:translateY(2px)}100%{transform:translateY(0)}}
</style>

<!-- head knock-out and beard wash -->
