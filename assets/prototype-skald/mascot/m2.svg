<path class="mm-ln" d="M60 88.5C54 85.5 44.5 86.5 39.5 92.5 37 95.8 39.2 98.6 42.4 96.8M60.2 88.4C66.2 85.4 75.6 86.6 80.6 92.6 83 95.9 80.8 98.7 77.6 96.9"/>
