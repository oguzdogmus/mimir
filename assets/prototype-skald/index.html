<!doctype html>
<!--
  PROTOTYPE (issue #87), throwaway, lives only on the prototype/skald branch.
  Plan: three radically different Skald candidates, each showing the same three test
  pieces (worked math answer, DFA diagram, bacterium layer by layer), switchable via
  ?variant= (candidate), ?piece=, ?theme=, ?motion= and ?width= on this one viewer page.
  Open this file directly in a browser (double-click); no server needed.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skald prototype viewer</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #6b6f76; font: 14px/1.4 system-ui, sans-serif; }
  #stage { position: absolute; inset: 0 0 64px 0; display: flex; gap: 24px; align-items: flex-start;
           justify-content: center; padding: 20px; overflow: auto; }
  .frame { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .frame .cap { color: #f1f1f1; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
  .phone iframe { width: 390px; height: 844px; border: 0; border-radius: 28px; background: #fff;
                  box-shadow: 0 0 0 10px #1d1f23, 0 12px 40px rgba(0,0,0,.45); }
  .desk { flex: 1 1 auto; min-width: 0; }
  .desk .clip { width: 100%; overflow: hidden; border-radius: 8px; box-shadow: 0 12px 40px rgba(0,0,0,.45); }
  .desk iframe { width: 1280px; height: 800px; border: 0; background: #fff; transform-origin: 0 0; display: block; }
  #bar { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 9;
         display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 999px;
         background: #111; color: #fff; box-shadow: 0 6px 24px rgba(0,0,0,.5); white-space: nowrap;
         max-width: calc(100vw - 16px); overflow-x: auto; }
  #bar button, #bar select { font: inherit; color: #fff; background: #2a2a2a; border: 1px solid #444;
         border-radius: 999px; padding: 5px 10px; cursor: pointer; }
  #bar button:hover, #bar select:hover { background: #3a3a3a; }
  #bar .label { min-width: 13em; text-align: center; font-weight: 600; }
  #bar .sep { width: 1px; height: 22px; background: #444; margin: 0 2px; }
  #bar a { color: #9cf; font-size: 12px; padding: 0 6px; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="bar" role="toolbar" aria-label="Prototype switcher">
  <button type="button" id="prev" title="Previous candidate (Left arrow)">&#8592;</button>
  <span class="label" id="label"></span>
  <button type="button" id="next" title="Next candidate (Right arrow)">&#8594;</button>
  <span class="sep"></span>
  <select id="piece" aria-label="Piece">
    <option value="math">Math answer</option>
    <option value="diagram">DFA diagram</option>
    <option value="bacterium">Bacterium</option>
  </select>
  <select id="theme" aria-label="Theme">
    <option value="light">Light</option>
    <option value="dark">Dark</option>
  </select>
  <select id="motion" aria-label="Motion level">
    <option value="none">Motion: none</option>
    <option value="gentle">Motion: gentle</option>
    <option value="full">Motion: full</option>
  </select>
  <select id="mascot" aria-label="Mascot">
    <option value="m4">Mascot: Mimir</option>
    <option value="off">Mascot: off</option>
  </select>
  <select id="width" aria-label="Width">
    <option value="both">Phone + desktop</option>
    <option value="phone">Phone 390</option>
    <option value="desktop">Desktop 1280</option>
  </select>
  <a id="open" href="#" target="_blank" title="Open the desktop page on its own (print it from there)">open</a>
</div>
<script>
(function () {
  "use strict";
  // key, folder, name. Builder-comparison builds can be appended here later.
  var VARIANTS = [
    {key: "B3", dir: "candidate-b3", name: "Chalk and slate (reference build)"},
    {key: "B3·S2", dir: "build-sonnet2", name: "Builder test: Sonnet, fixed guide"},
    {key: "B3·S", dir: "build-sonnet", name: "Builder test: Sonnet, first guide"},
    {key: "B3·O", dir: "build-opus", name: "Builder test: Opus"},
    {key: "B2·N1", dir: "candidate-b2n1", name: "Slate, graphite and pink"},
    {key: "B2·N2", dir: "candidate-b2n2", name: "Slate, graphite and fjord blue"},
    {key: "B2·N3", dir: "candidate-b2n3", name: "Slate paper, B2 inks"}
  ];
  var params = new URLSearchParams(location.search);
  var state = {
    variant: params.get("variant") || "B3",
    piece: params.get("piece") || "math",
    theme: params.get("theme") || "light",
    motion: params.get("motion") || "none",
    width: params.get("width") || "both",
    mascot: params.get("mascot") || "m4"
  };
  var stage = document.getElementById("stage");
  function idx() {
    for (var i = 0; i < VARIANTS.length; i++) if (VARIANTS[i].key === state.variant) return i;
    return 0;
  }
  function src() {
    var v = VARIANTS[idx()];
    return v.dir + "/" + state.piece + ".html?theme=" + state.theme + "&motion=" + state.motion + "&mascot=" + state.mascot;
  }
  function fit() {
    var clip = stage.querySelector(".desk .clip");
    if (!clip) return;
    var f = clip.querySelector("iframe");
    var s = Math.min(1, clip.clientWidth / 1280);
    f.style.transform = "scale(" + s + ")";
    var h = Math.max(500, (stage.clientHeight - 60) / s);
    f.style.height = h + "px";
    clip.style.height = (h * s) + "px";
  }
  function render() {
    var v = VARIANTS[idx()];
    state.variant = v.key;
    document.getElementById("label").textContent = v.key + " (" + v.name + ")";
    ["piece", "theme", "motion", "width", "mascot"].forEach(function (k) { document.getElementById(k).value = state[k]; });
    var url = src();
    var html = "";
    if (state.width !== "desktop") html += '<div class="frame phone"><span class="cap">Phone 390</span><iframe title="Phone view"></iframe></div>';
    if (state.width !== "phone") html += '<div class="frame desk"><span class="cap">Desktop 1280 (scaled to fit)</span><div class="clip"><iframe title="Desktop view"></iframe></div></div>';
    stage.innerHTML = html;
    var frames = stage.querySelectorAll("iframe");
    for (var i = 0; i < frames.length; i++) frames[i].src = url;
    if (state.width === "phone") stage.style.justifyContent = "center";
    document.getElementById("open").href = url;
    var q = new URLSearchParams(state);
    history.replaceState(null, "", "?" + q.toString());
    fit();
  }
  function cycle(d) {
    state.variant = VARIANTS[(idx() + d + VARIANTS.length) % VARIANTS.length].key;
    render();
  }
  document.getElementById("prev").addEventListener("click", function () { cycle(-1); });
  document.getElementById("next").addEventListener("click", function () { cycle(1); });
  ["piece", "theme", "motion", "width", "mascot"].forEach(function (k) {
    document.getElementById(k).addEventListener("change", function (e) { state[k] = e.target.value; render(); });
  });
  document.addEventListener("keydown", function (e) {
    var t = e.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable)) return;
    if (e.key === "ArrowLeft") { e.preventDefault(); cycle(-1); }
    else if (e.key === "ArrowRight") { e.preventDefault(); cycle(1); }
  });
  window.addEventListener("resize", fit);
  render();
})();
</script>
</body>
</html>
